<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'" />
  <title>Kaset</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="brand"><img src="../../build/icon.png" alt="" /><span>Kaset</span></div>
      </div>
      <nav id="nav" class="music-only">
        <a class="nav-item" data-route="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></a>
        <a class="nav-item" data-route="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
        <div class="nav-header">Discover</div>
        <a class="nav-item" data-route="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5S9.7 5.9 12 3.5z"/></svg><span>Explore</span></a>
        <a class="nav-item" data-route="charts"><svg viewBox="0 0 24 24"><path d="M3.5 18l5-6 4 3.5 7.5-9"/><path d="M15.5 6.5H20V11"/></svg><span>Charts</span></a>
        <a class="nav-item" data-route="moods"><svg viewBox="0 0 24 24"><path d="M12 20.5c-4.5 0-8-3.2-8-7.6 0-3.6 2.8-6.2 5.6-8.4.4 2.3 1.6 3.6 3.2 4.3.9-1.6 1-3.3.6-5.3 3.2 2 6.6 5 6.6 9.4 0 4.4-3.5 7.6-8 7.6z"/></svg><span>Moods &amp; Genres</span></a>
        <a class="nav-item" data-route="newReleases"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg><span>New Releases</span></a>
        <a class="nav-item" data-route="podcasts"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Podcasts</span></a>
        <div class="nav-header">Collection</div>
        <a class="nav-item" data-route="library"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M6.5 4.5h11"/></svg><span>Library</span></a>
        <a class="nav-item" data-route="liked"><svg viewBox="0 0 24 24" class="fill"><path d="M12 20.3s-7.8-4.7-7.8-10.6A4.4 4.4 0 0 1 12 6.9a4.4 4.4 0 0 1 7.8 2.8c0 5.9-7.8 10.6-7.8 10.6z"/></svg><span>Liked Music</span></a>
        <a class="nav-item" data-route="history"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5v4h4"/><path d="M12 8v4.2l2.8 1.8"/></svg><span>History</span></a>
        <div class="nav-header with-action">Playlists <button id="new-playlist" class="mini-icon" title="Create Playlist"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div id="sidebar-playlists"></div>
      </nav>
      <nav id="yt-nav" class="yt-only">
        <a class="nav-item" data-route="yt-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></a>
        <a class="nav-item" data-route="yt-home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
        <a class="nav-item" data-route="yt-subs"><svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M6 6h12M8.5 3.5h7"/><path class="fill" d="M10.5 12.3v5.4l4.3-2.7z"/></svg><span>Subscriptions</span></a>
        <div class="nav-header">Discover</div>
        <a class="nav-item" data-route="yt-explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Explore</span></a>
        <div class="nav-header">Collection</div>
        <a class="nav-item" data-route="yt-liked"><svg viewBox="0 0 24 24"><path d="M7.5 20h-3v-9h3zM7.5 11.5l4-7.5a2 2 0 0 1 2 2.3l-.7 3.7H18a2 2 0 0 1 2 2.3l-1.2 5.5a2 2 0 0 1-2 1.6H7.5"/></svg><span>Liked Videos</span></a>
        <a class="nav-item" data-route="yt-wl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Watch Later</span></a>
        <a class="nav-item" data-route="yt-playlists"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7M15.5 14v6.5l5-3.25z"/></svg><span>Playlists</span></a>
        <a class="nav-item" data-route="yt-history"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5v4h4"/><path d="M12 8v4.2l2.8 1.8"/></svg><span>History</span></a>
        <div class="nav-header">Subscriptions</div>
        <div id="yt-sidebar-subs"></div>
      </nav>
      <div class="source-toggle" id="source-toggle" role="tablist" aria-label="Source">
        <button data-source="music" role="tab" title="YouTube Music (Ctrl+Shift+Y)"><svg viewBox="0 0 24 24"><path d="M9 18.5V6l10-2v12.5"/><circle cx="6.5" cy="18.5" r="2.5" class="fill"/><circle cx="16.5" cy="16.5" r="2.5" class="fill"/></svg>Music</button>
        <button data-source="youtube" role="tab" title="YouTube (Ctrl+Shift+Y)"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4" class="fill"/><path d="M10 9v6l5-3z" fill="#fff" stroke="none"/></svg>YouTube</button>
      </div>
      <div id="account" class="account"></div>
    </aside>

    <div id="main">
      <header id="topbar">
        <div class="nav-buttons">
          <button id="back" class="icon-btn" title="Back (Alt+Left)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
          <button id="forward" class="icon-btn" title="Forward (Alt+Right)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button>
        </div>
        <div id="page-title" class="page-title-bar"></div>
        <div class="drag-spacer"></div>
        <button id="cmd-btn" class="glass-circle" title="Command Bar (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M12 3.5l1.6 4.9L18.5 10l-4.9 1.6L12 16.5l-1.6-4.9L5.5 10l4.9-1.6zM18 15l.7 1.8 1.8.7-1.8.7L18 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg></button>
      </header>
      <main id="content" tabindex="-1"></main>
      <div class="bar-fade"></div>

      <footer id="playerbar" class="glass">
        <div class="pb-left">
          <button id="shuffle" class="icon-btn small music-only" title="Shuffle (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M3.5 7h3.6c2 0 3 1 4.4 3.5S14.4 17 16.4 17h4M3.5 17h3.6c1.2 0 2-.4 2.8-1.2M13.6 8.2c.7-.8 1.6-1.2 2.8-1.2h4M18 4.5L20.5 7 18 9.5M18 14.5l2.5 2.5-2.5 2.5"/></svg><span id="smart-badge" class="badge hidden">✦</span></button>
          <button id="prev" class="icon-btn music-only" title="Previous (Ctrl+Left)"><svg viewBox="0 0 24 24" class="fill"><path d="M11.5 6.2v11.6L3 12zM21 6.2v11.6L12.5 12z"/></svg></button>
          <button id="playpause" class="icon-btn play music-only" title="Play (Space)"><svg viewBox="0 0 24 24" class="fill"><path id="pp-path" d="M7 4.5v15l12.5-7.5z"/></svg></button>
          <button id="next" class="icon-btn music-only" title="Next (Ctrl+Right)"><svg viewBox="0 0 24 24" class="fill"><path d="M12.5 6.2v11.6L21 12zM3 6.2v11.6L11.5 12z"/></svg></button>
          <button id="repeat" class="icon-btn small music-only" title="Repeat (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M4.5 11V9.5a3 3 0 0 1 3-3h12M16.5 3.5l3 3-3 3M19.5 13v1.5a3 3 0 0 1-3 3h-12M7.5 20.5l-3-3 3-3"/></svg><span id="repeat-one" class="badge hidden">1</span></button>
          <button id="yt-back" class="icon-btn yt-only" title="Back 10 seconds (Left)"><svg viewBox="0 0 24 24" class="fill"><path d="M11.5 6.2v11.6L3 12zM21 6.2v11.6L12.5 12z"/></svg></button>
          <button id="yt-play" class="icon-btn play yt-only" title="Play (Space)"><svg viewBox="0 0 24 24" class="fill"><path id="yt-pp-path" d="M7 4.5v15l12.5-7.5z"/></svg></button>
          <button id="yt-fwd" class="icon-btn yt-only" title="Forward 10 seconds (Right)"><svg viewBox="0 0 24 24" class="fill"><path d="M12.5 6.2v11.6L21 12zM3 6.2v11.6L11.5 12z"/></svg></button>
        </div>
        <div class="pb-center yt-only idle" id="yt-center">
          <div class="np">
            <div id="yt-np-art" class="yt-np-art" title="Show Video"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path class="fill" d="M10.5 9.5v5l4-2.5z"/></svg><img alt="" /></div>
            <div class="np-text">
              <div id="yt-np-title" class="np-title"></div>
              <div id="yt-np-sub" class="np-artist"></div>
            </div>
          </div>
          <div class="pb-progress" id="yt-progress">
            <span id="yt-cur">0:00</span>
            <div class="track-lane" id="yt-lane"><div class="lane-fill" id="yt-fill"></div><div class="lane-knob" id="yt-knob"></div></div>
            <span id="yt-dur">0:00</span>
          </div>
        </div>
        <div class="pb-center music-only">
          <div class="np" id="np">
            <img id="np-art" alt="" title="Open Now Playing" />
            <div class="np-text">
              <div id="np-title" class="np-title"></div>
              <div id="np-artist" class="np-artist"></div>
            </div>
          </div>
          <div class="pb-progress" id="progress">
            <span id="time-cur">0:00</span>
            <div class="track-lane"><div class="lane-fill" id="lane-fill"></div><div class="lane-knob" id="lane-knob"></div></div>
            <span id="time-dur">0:00</span>
          </div>
        </div>
        <div class="pb-right">
          <button id="dislike" class="icon-btn small music-only" title="Dislike"><svg viewBox="0 0 24 24"><path d="M16.5 4h3v9h-3zM16.5 12.5l-4 7.5a2 2 0 0 1-2-2.3l.7-3.7H6a2 2 0 0 1-2-2.3l1.2-5.5A2 2 0 0 1 7.2 4.6h9.3"/></svg></button>
          <button id="like" class="icon-btn small music-only" title="Like (Ctrl+L)"><svg viewBox="0 0 24 24"><path d="M7.5 20h-3v-9h3zM7.5 11.5l4-7.5a2 2 0 0 1 2 2.3l-.7 3.7H18a2 2 0 0 1 2 2.3l-1.2 5.5a2 2 0 0 1-2 1.6H7.5"/></svg></button>
          <button id="btn-lyrics" class="icon-btn small music-only" title="Lyrics (Ctrl+Shift+L)"><svg viewBox="0 0 24 24"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V16.5H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5z"/><path d="M8 9h8M8 12h5"/></svg></button>
          <button id="btn-queue" class="icon-btn small music-only" title="Up Next (Ctrl+Shift+Q)"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7M15.5 14v6.5l5-3.25z"/></svg></button>
          <button id="btn-mini" class="icon-btn small music-only" title="Mini Player (Ctrl+Shift+M)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11.5" width="6.5" height="5" rx="1" class="fill"/></svg></button>
          <button id="btn-video" class="icon-btn small music-only" title="Video"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="12" rx="2"/><path d="M8 20.5h8"/></svg></button>
          <button id="btn-eq" class="icon-btn small music-only" title="Equalizer"><svg viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="14" r="2" class="fill"/><circle cx="12" cy="8" r="2" class="fill"/><circle cx="18" cy="15.5" r="2" class="fill"/></svg></button>
          <button id="yt-like" class="icon-btn small yt-only" title="Like (Ctrl+L)"><svg viewBox="0 0 24 24"><path d="M7.5 20h-3v-9h3zM7.5 11.5l4-7.5a2 2 0 0 1 2 2.3l-.7 3.7H18a2 2 0 0 1 2 2.3l-1.2 5.5a2 2 0 0 1-2 1.6H7.5"/></svg></button>
          <button id="yt-dislike" class="icon-btn small yt-only" title="Dislike"><svg viewBox="0 0 24 24"><path d="M16.5 4h3v9h-3zM16.5 12.5l-4 7.5a2 2 0 0 1-2-2.3l.7-3.7H6a2 2 0 0 1-2-2.3l1.2-5.5A2 2 0 0 1 7.2 4.6h9.3"/></svg></button>
          <button id="yt-wl" class="icon-btn small yt-only" title="Save to Watch Later"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
          <button id="yt-cc" class="icon-btn small yt-only" title="Captions (C)"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/></svg></button>
          <button id="yt-quality" class="icon-btn small yt-only" title="Quality"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
          <button id="yt-full" class="icon-btn small yt-only" title="Full Screen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button id="yt-window" class="icon-btn small yt-only" title="Video Window"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11.5" width="6.5" height="5" rx="1" class="fill"/></svg></button>
          <div class="vol">
            <button id="mute" class="icon-btn small" title="Mute"><svg viewBox="0 0 24 24"><path class="fill" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path id="vol-waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
            <input id="volume" type="range" min="0" max="100" value="80" />
          </div>
        </div>
      </footer>
    </div>

    <aside id="sidepanel" class="glass hidden">
      <div class="panel-tabs">
        <button data-panel="queue" class="tab">Up Next</button>
        <button data-panel="lyrics" class="tab">Lyrics</button>
        <button id="panel-close" class="icon-btn small" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </div>

  <div id="nowplaying" class="hidden">
    <div class="np-bg" id="fs-bg"></div>
    <div class="fs-top">
      <button id="fs-close" class="glass-circle" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="fs-tabs glass"><button data-fs="lyrics" class="on">Lyrics</button><button data-fs="queue">Up Next</button><button data-fs="none">Artwork</button></div>
      <div style="width:40px"></div>
    </div>
    <div class="fs-body">
      <div class="fs-left">
        <img id="fs-art" alt="" />
        <div class="fs-meta"><div id="fs-title"></div><div id="fs-artist"></div></div>
        <div class="fs-progress"><input id="fs-seek" type="range" min="0" max="1000" value="0" /><div class="fs-times"><span id="fs-cur">0:00</span><span id="fs-dur">0:00</span></div></div>
        <div class="fs-controls">
          <button class="icon-btn small" data-cmd="shuffle"><svg viewBox="0 0 24 24"><path d="M3.5 7h3.6c2 0 3 1 4.4 3.5S14.4 17 16.4 17h4M3.5 17h3.6c1.2 0 2-.4 2.8-1.2M13.6 8.2c.7-.8 1.6-1.2 2.8-1.2h4M18 4.5L20.5 7 18 9.5M18 14.5l2.5 2.5-2.5 2.5"/></svg></button>
          <button class="icon-btn big" data-cmd="previous"><svg viewBox="0 0 24 24" class="fill"><path d="M11.5 6.2v11.6L3 12zM21 6.2v11.6L12.5 12z"/></svg></button>
          <button class="icon-btn huge" data-cmd="playPause"><svg viewBox="0 0 24 24" class="fill"><path id="fs-pp" d="M7 4.5v15l12.5-7.5z"/></svg></button>
          <button class="icon-btn big" data-cmd="next"><svg viewBox="0 0 24 24" class="fill"><path d="M12.5 6.2v11.6L21 12zM3 6.2v11.6L11.5 12z"/></svg></button>
          <button class="icon-btn small" data-cmd="repeat"><svg viewBox="0 0 24 24"><path d="M4.5 11V9.5a3 3 0 0 1 3-3h12M16.5 3.5l3 3-3 3M19.5 13v1.5a3 3 0 0 1-3 3h-12M7.5 20.5l-3-3 3-3"/></svg></button>
        </div>
      </div>
      <div class="fs-right" id="fs-right"></div>
    </div>
  </div>

  <div id="ctxmenu" class="ctxmenu glass-menu hidden"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast glass hidden"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
